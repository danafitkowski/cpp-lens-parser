name: test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      # dist/ is generated, not committed (.gitignore line 2). Without it,
      # tests/browser/smoke.test.js cannot import ../../dist/index.js at all,
      # and the dist/-mirrors-src/ freshness test has nothing to compare.
      - name: Build dist/ (gitignored, generated from src/)
        run: npm run build

      # tests/fixtures/large-synthetic.xer is generated, not committed
      # (.gitignore line 6). Without it, tests/unit/gzip.test.js fails at
      # collection (module-scope read), tests/perf/parse-perf.test.js throws
      # ENOENT, and the write-xer round-trip case for it silently disappears
      # (that suite globs the fixtures dir). Deterministic: 724,774 bytes,
      # sha256 15be24343a665aa8a7390f98712e384b4b8ba0f622be64f4428da4cb9f85e718.
      # No argument — the generator defaults N to 5000, the full perf workload.
      - name: Generate 5000-activity perf fixture (gitignored, deterministic)
        run: npm run fixtures

      # DELIBERATE EXCLUSION — tests/parity/ is NOT run in CI.
      #
      # The parity suite (tests/parity/parity.test.js, 10 tests) diffs this JS
      # parser against the canonical Python xer-parser skill, which
      # python_emit.py imports from ~/.claude/skills/xer-parser/scripts. That
      # skill exists only on Dana's machines; it is not vendored here because
      # a checked-in copy would drift from the canonical source and fake
      # parity against a stale reference. Without it, python_emit.py fails at
      # import and every parity test errors — so the stage is excluded
      # explicitly rather than left to fail or skip silently.
      #
      # Parity coverage still runs locally: `npm test` (all 313 tests) or
      # `npm run test:parity` before any release.
      #
      # This invocation runs the unit, browser, and perf suites:
      # 28 files / 303 of 313 tests.
      - name: Run tests (parity excluded — see comment above)
        run: npx vitest run --exclude "tests/parity/**"
